
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge - Volunteer Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <nav>
        <div class="logo">FoodBridge</div>
        <div>
            <a href="index.html">Home</a>
            <a href="ngo.html">NGO Portal</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Volunteer <span>Portal</span></h1>
        <p>Help collect and deliver donated food to people in need.</p>
    </section>

    <section class="portal-container">
        <div class="portal-card">
            <h2>Food Pickup and Delivery</h2>
            
<div class="volunteer-details">
    <h3>Volunteer Details</h3>

    <label for="volunteerName">Volunteer Name:</label>
    <input
        type="text"
        id="volunteerName"
        placeholder="Enter your full name"
        required
    >

    <label for="volunteerPhone">Mobile Number:</label>
    <input
        type="tel"
        id="volunteerPhone"
        placeholder="Enter 10-digit mobile number"
        pattern="[6-9][0-9]{9}"
        maxlength="10"
        required
    >
</div>

            <p>
                View available donation details, pickup locations,
                delivery destinations, and navigation links.
            </p>
            <div id="volunteerStatus">
    Volunteer assignments will appear here.
</div>

<div id="volunteerAssignments">
    <!-- Food pickup and delivery assignments will appear here -->
</div>
        </div>
    </section>



</body>
</html>
