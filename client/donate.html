
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge - Donate Food</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <nav>
        <div class="logo">FoodBridge</div>
        <a href="donor.html">Back to Donor Portal</a>
    </nav>

    <section id="donation-form-section">
        <h1>Donate Surplus Food</h1>
        <p>Enter the details of the food you want to donate.</p>

        <form id="donationForm">

            <label for="foodName">Food Name</label>
            <input
                type="text"
                id="foodName"
                name="foodName"
                placeholder="Example: Vegetable rice"
                required
            >

            <label for="quantity">Quantity (in kg)</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="0.1"
                max="500"
                step="0.1"
                placeholder="Example: 10"
                required
            >

            <label for="description">Food Description</label>
            <textarea
                id="description"
                name="description"
                rows="4"
                minlength="10"
                maxlength="200"
                placeholder="Describe the food and how it is packed"
                required
            ></textarea>
            
<label for="restaurantName">Restaurant / Donor Name:</label>
<input
    type="text"
    id="restaurantName"
    name="restaurantName"
    placeholder="Enter restaurant or donor name"
    required
>

<label for="pickupAddress">Pickup Address:</label>
<input
    type="text"
    id="pickupAddress"
    name="pickupAddress"
    placeholder="Enter full pickup address"
    required
>

<label for="contactPhone">Contact Phone Number:</label>
<input
    type="tel"
    id="contactPhone"
    name="contactPhone"
    placeholder="Enter 10-digit mobile number"
    pattern="[6-9][0-9]{9}"
    maxlength="10"
    required
>


<label for="mapsLink">Google Maps Link (optional):</label>
<input
    type="url"
    id="mapsLink"
    name="mapsLink"
    placeholder="Paste Google Maps location link"
>


            <label for="foodImage">Food Image URL (optional)</label>
            <input
                type="url"
                id="foodImage"
                name="foodImage"
                placeholder="Paste a link to the food image"
            >

            <label for="preparedAt">Preparation Date and Time</label>
            <input
                type="datetime-local"
                id="preparedAt"
                name="preparedAt"
                required
            >

            <label for="pickupDeadline">Pickup Deadline</label>
            <input
                type="datetime-local"
                id="pickupDeadline"
                name="pickupDeadline"
                required
            >

            <label for="storage">Storage Method</label>
            <select id="storage" name="storage" required>
                <option value="">Select storage method</option>
                <option value="hot">Kept hot</option>
                <option value="refrigerated">Refrigerated</option>
                <option value="room-temperature">Room temperature</option>
            </select>

            <button type="submit">Submit Donation</button>

        </form>
    </section>

</body>
</html>
